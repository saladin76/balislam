# فحص تلقائي لكل دفعة: الأنواع والاختبارات. لا يحتاج أي مفاتيح (لا صوت ولا رندر).
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # التاريخ كاملًا: tests/strong-voice.test.ts يقارن src/voice/tones.ts بنسخته قبل D70 (git show bf21ec72)،
        # والنسخة الضحلة الافتراضية (عمق 1) لا تحوي ذلك الـcommit (033).
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci
      - name: Required delivery gate
        env:
          STUDIO_GATE_BASE: ${{ github.event.pull_request.base.sha }}
          STUDIO_GATE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$STUDIO_GATE_BASE" ]; then
            npm run gate -- --range "$STUDIO_GATE_BASE..$STUDIO_GATE_HEAD"
          else
            npm run gate
          fi

# فحص تلقائي لكل دفعة: الأنواع والاختبارات. لا يحتاج أي مفاتيح (لا صوت ولا رندر).
name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Nightly: the full journey for the three channels (work ٤ of the stabilization brief).
  schedule:
    - cron: "37 1 * * *"
  workflow_dispatch:
    inputs:
      channels:
        description: "e2e channels (balislam | dafatir-alzaman | zubdat-alkutub | all)"
        default: all
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # التاريخ كاملًا للبوابة وحدها: `--range BASE..HEAD` يفحص تزامن التوثيق (scripts/docs-sync.mjs) لكل
        # commit في الـPR، ويحتاج commit الأساس في النسخة. لا اختبار يقرأ تاريخ Git (KI-030، D113).
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci
      - name: Required delivery gate
        env:
          STUDIO_GATE_BASE: ${{ github.event.pull_request.base.sha }}
          STUDIO_GATE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$STUDIO_GATE_BASE" ]; then
            npm run gate -- --range "$STUDIO_GATE_BASE..$STUDIO_GATE_HEAD"
          else
            npm run gate
          fi

  # The owner's whole journey over the real Studio server (stabilization brief, work ٤): fake voice provider,
  # tiny real Remotion renders, Drive copy to a temp folder, content sync on a temp git repo. No key, no network service.
  # Every push / PR: «بالإسلام» (the longest rules: verse, recitation, D35). Nightly and on demand: all three channels.
  # Which channels the e2e journeys run on (KI-083): the scheduled run and a PR that touches shared code → all three;
  # a PR that only changes one channel's content → that channel; anything else → «بالإسلام». A list, so each channel
  # runs as its own job in parallel: three channels one after another passed the 75-minute limit once the 25-shorts
  # journey joined (run 44257847109, cancelled at 1h15m).
  e2e-plan:
    runs-on: ubuntu-latest
    outputs:
      channels: ${{ steps.plan.outputs.channels }}
      ui: ${{ steps.plan.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ github.event.inputs.channels }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          ALL='["balislam","dafatir-alzaman","zubdat-alkutub"]'
          list() { printf '%s' "$1" | tr ',' '\n' | sed '/^$/d; s/.*/"&"/' | paste -sd, - | sed 's/.*/[&]/'; }
          if [ "$EVENT" = "schedule" ]; then OUT=$ALL
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            if [ -z "$INPUT" ] || [ "$INPUT" = "all" ]; then OUT=$ALL; else OUT=$(list "$INPUT"); fi
          elif [ "$EVENT" = "pull_request" ]; then
            CHANGED=$(git diff --name-only "$BASE"...HEAD)
            # A PR of Markdown only (docs, logs, known issues) renders nothing: no journey. check (types, tests, the
            # documentation gate) still runs on every PR, and main still runs the journeys after every merge.
            if [ -n "$CHANGED" ] && ! printf '%s\n' "$CHANGED" | grep -qvE '\.md$'; then OUT='[]'; UI=false
            elif printf '%s\n' "$CHANGED" | grep -qE '^(src|app|scripts|bin|brand|tests|\.github)/|^package(-lock)?\.json$|^vite|^tsconfig'; then OUT=$ALL
            else
              CH=$(printf '%s\n' "$CHANGED" | sed -nE 's#^channels/(balislam|dafatir-alzaman|zubdat-alkutub)/.*#\1#p' | sort -u | paste -sd, -)
              OUT=$(list "${CH:-balislam}")
            fi
          else OUT='["balislam"]'
          fi
          echo "channels=$OUT" >> "$GITHUB_OUTPUT"; echo "ui=${UI:-true}" >> "$GITHUB_OUTPUT"; echo "e2e channels: $OUT · ui: ${UI:-true}"

  e2e:
    needs: [check, e2e-plan]
    if: needs.e2e-plan.outputs.channels != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.e2e-plan.outputs.channels) }}
    name: e2e (${{ matrix.channel }})
    env:
      BAL_E2E_CHANNELS: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci
      - name: Render browser (Remotion)
        run: npx remotion browser ensure
      - name: Full journey (API)
        run: npm run e2e

  # The Studio page journey (Playwright) covers the three channels in one run (its dock parity, D150): once, beside the e2e jobs.
  e2e-ui:
    needs: [check, e2e-plan]
    if: needs.e2e-plan.outputs.ui != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci
      - name: Render browser (Remotion)
        run: npx remotion browser ensure
      - name: Full journey (the Studio page, Playwright)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
          npm run e2e:ui -- --shots "$RUNNER_TEMP/e2e-ui-shots"
      - name: Studio page screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ui-shots
          path: ${{ runner.temp }}/e2e-ui-shots
          if-no-files-found: ignore

  # main لا يحمرّ بصمت (KI-068، D137): حفظ الاستوديو يمر على بوابة المحتوى وحدها بلا اختبارات (D101)، فإن حمّر
  # main تُفتح قضية واحدة «main أحمر» بالفحص الفاشل والـcommit (أو يُضاف إليها تعليق)، وتُغلق آليًا عند أول main أخضر.
  # يراها كل مطوّر ووكيل في GitHub وفي «npx bal notes --open» أول كل جلسة. لا تغيّر محتوى ولا تمنع حفظًا.
  main-status:
    needs: [check, e2e, e2e-ui]
    if: always() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Open, update or close the «main أحمر» issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CHECK: ${{ needs.check.result }}
          E2E: ${{ needs.e2e.result }}
          E2EUI: ${{ needs.e2e-ui.result }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: ${{ github.event.head_commit.message || 'التشغيل المجدول (القنوات الثلاث)' }}
        run: |
          set -u
          MARK="main أحمر (CI)"
          open=$(gh api "repos/$REPO/issues?state=open&per_page=100" --jq ".[] | select(.pull_request == null and .title == \"$MARK\") | .number" | head -1)
          if [ "$CHECK" = "success" ] && { [ "$E2E" = "success" ] || [ "$E2E" = "skipped" ]; } && { [ "$E2EUI" = "success" ] || [ "$E2EUI" = "skipped" ]; }; then
            [ -n "$open" ] && gh api -X POST "repos/$REPO/issues/$open/comments" -f body="main أخضر من جديد على \`${SHA:0:8}\` ($RUN_URL)." >/dev/null \
              && gh api -X PATCH "repos/$REPO/issues/$open" -f state=closed >/dev/null
            exit 0
          fi
          [ "$CHECK" = "cancelled" ] && exit 0
          summary=$(gh api "repos/$REPO/actions/runs/${{ github.run_id }}/jobs" --jq '.jobs[] | select(.conclusion == "failure") | .name' | paste -sd, -)
          first=$(printf '%s' "$TITLE" | head -1)
          studio=""; case "$first" in "حفظ الاستوديو"*) studio=$'\n\nهذا commit حفظ من استوديو المالك (محتوى فقط، D101): لا يُغيَّر محتوى المالك؛ الاختبار الذي يثبّت المحتوى يُكتب عقدًا (KI-068، D137).';; esac
          body="الفحص الفاشل: ${summary:-check}"$'\n'"الـcommit: \`${SHA:0:8}\` — ${first}"$'\n'"السجل: $RUN_URL${studio}"$'\n\n'"حتى يخضرّ main ترفض بوابة الدفع كل دفع كود يحمل الفشل نفسه."
          if [ -n "$open" ]; then
            gh api -X POST "repos/$REPO/issues/$open/comments" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/$REPO/issues" -f title="$MARK" -f body="$body" >/dev/null
          fi
